<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts Dod • Stock Manager</title>
<style>
body{margin:0;font-family:system-ui;background:#f4f6fa;color:#182033}header{background:#182033;color:white;padding:18px}main{max-width:1100px;margin:auto;padding:15px}.card,.item{background:white;border:1px solid #e2e7ef;border-radius:14px;padding:14px;margin:10px 0}button,input{font:inherit;padding:10px;border:1px solid #ddd;border-radius:9px;background:white}button{font-weight:700;cursor:pointer}.primary{background:#2563eb;color:white}.green{background:#e9f8f0}.red{background:#fff0f0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat b{display:block;font-size:22px}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}.row{display:flex;justify-content:space-between;gap:10px}.qty{font-size:22px;font-weight:800}.muted{color:#687386;font-size:12px}dialog{border:0;border-radius:15px;width:min(480px,92vw)}dialog::backdrop{background:#0008}.form{display:grid;gap:10px}.form input{width:100%;box-sizing:border-box}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><b>📦 Accounts Dod • Stock Manager</b><div class="muted" style="color:#bdc6d5">File-Sync Edition • Accounts Dod</div></header>
<main>
<div class="card"><b>📁 Data Storage</b><p id="status">No folder selected</p><div class="actions"><button class="primary" onclick="pick()">Select Data Folder</button><button onclick="save()">Save Now</button></div><p class="muted">Select a Google Drive, Dropbox, OneDrive, or normal local folder. The app writes stock-data.json and a backups folder there.</p></div>
<div class="stats"><div class="card stat">Items<b id="count">0</b></div><div class="card stat">Quantity<b id="tqty">0</b></div><div class="card stat">Valuation<b id="value">₹0</b></div><div class="card stat">Last Saved<b id="saved">Not saved</b></div></div>
<div class="toolbar"><input id="search" placeholder="🔎 Search item..." oninput="render()"><button class="primary" onclick="openItem()">＋ Create Item</button><button onclick="backup()">⬇ Backup</button><button onclick="document.getElementById('restore').click()">⬆ Restore</button><input id="restore" type="file" accept=".json" hidden onchange="restoreFile(event)"></div>
<div id="items"></div></main>
<dialog id="itemDlg"><form class="form" method="dialog" onsubmit="itemSave(event)"><h2 id="dlgTitle">Create Item</h2><input type="hidden" id="eid"><label>Name<input id="name" required></label><label>Code/SKU<input id="code"></label><label>Unit<input id="unit" value="Nos"></label><label>Rate<input id="rate" type="number" min="0" step=".01" required></label><label>Quantity<input id="qty" type="number" min="0" step=".001" required></label><div class="actions"><button class="primary">Save</button><button type="button" onclick="itemDlg.close()">Cancel</button></div></form></dialog>
<dialog id="moveDlg"><form class="form" method="dialog" onsubmit="moveSave(event)"><h2 id="moveTitle"></h2><input type="hidden" id="mid"><input type="hidden" id="mtype"><label>Quantity<input id="mqty" type="number" min=".001" step=".001" required></label><label>Note<input id="note"></label><div class="actions"><button class="primary">Save</button><button type="button" onclick="moveDlg.close()">Cancel</button></div></form></dialog>
<dialog id="histDlg"><h2>History</h2><div id="hist"></div><button onclick="histDlg.close()">Close</button></dialog>
<script>
let db=JSON.parse(localStorage.getItem("stock-file-cache")||'{"items":[],"history":[],"updatedAt":null}'),dir=null,fh=null,saving=false;
const $=x=>document.getElementById(x),uid=()=>crypto.randomUUID(),money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR"}).format(n||0),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function date(x){return x?new Date(x).toLocaleString("en-IN"):"Not saved"}
async function perm(){return dir&&(await dir.requestPermission({mode:"readwrite"}))==="granted"}
async function pick(){if(!window.showDirectoryPicker){alert("Use Chrome or Edge on Windows for folder storage.");return}try{dir=await showDirectoryPicker({mode:"readwrite"});await loadFolder();$("status").textContent="Connected to folder: "+dir.name}catch(e){if(e.name!=="AbortError")alert(e.message)}}
async function loadFolder(){if(!await perm())return;fh=await dir.getFileHandle("stock-data.json",{create:true});let f=await fh.getFile(),t=await f.text();if(t.trim()){try{db=JSON.parse(t)}catch{db={items:[],history:[],updatedAt:null}}}else await save();render()}
async function save(){localStorage.setItem("stock-file-cache",JSON.stringify(db));if(!dir){$("saved").textContent="Browser only";return}if(saving)return;saving=true;try{if(!await perm())throw Error("Folder permission denied");fh=fh||await dir.getFileHandle("stock-data.json",{create:true});db.updatedAt=new Date().toISOString();let w=await fh.createWritable();await w.write(JSON.stringify(db,null,2));await w.close();let b=await dir.getDirectoryHandle("backups",{create:true}),n="backup-"+new Date().toISOString().replace(/[:.]/g,"-")+".json",bh=await b.getFileHandle(n,{create:true}),bw=await bh.createWritable();await bw.write(JSON.stringify(db,null,2));await bw.close();$("saved").textContent=date(db.updatedAt)}catch(e){alert("Save failed: "+e.message)}finally{saving=false}}
function render(){let q=$("search").value.toLowerCase(),a=db.items.filter(x=>(x.name+" "+(x.code||"")).toLowerCase().includes(q));$("count").textContent=db.items.length;$("tqty").textContent=db.items.reduce((s,x)=>s+ +x.qty,0).toLocaleString("en-IN");$("value").textContent=money(db.items.reduce((s,x)=>s+x.qty*x.rate,0));$("saved").textContent=date(db.updatedAt);$("items").innerHTML=a.length?a.map(x=>`<div class=item><div class=row><div><b>${esc(x.name)}</b><div class=muted>${esc(x.code||"No code")} • ${esc(x.unit)} • Rate ${money(x.rate)}</div></div><div style=text-align:right><div class=qty>${x.qty} ${esc(x.unit)}</div><div class=muted>${money(x.qty*x.rate)}</div></div></div><div class=actions><button class=green onclick="move('${x.id}','add')">＋ Add</button><button class=red onclick="move('${x.id}','less')">− Less</button><button onclick="edit('${x.id}')">✏ Edit</button><button onclick="history('${x.id}')">🕐 History</button><button onclick="del('${x.id}')">🗑 Delete</button></div><div class=muted>Edited ${date(x.updatedAt)}</div></div>`).join(""):"<div class=card>No items found.</div>"}
function openItem(x){$("dlgTitle").textContent=x?"Edit Item":"Create Item";$("eid").value=x?.id||"";$("name").value=x?.name||"";$("code").value=x?.code||"";$("unit").value=x?.unit||"Nos";$("rate").value=x?.rate??0;$("qty").value=x?.qty??0;$("itemDlg").showModal()}
function edit(id){openItem(db.items.find(x=>x.id===id))}
async function itemSave(e){e.preventDefault();let id=$("eid").value,n=new Date().toISOString(),x=db.items.find(a=>a.id===id);if(x){Object.assign(x,{name:$("name").value.trim(),code:$("code").value.trim(),unit:$("unit").value.trim()||"Nos",rate:+$("rate").value,qty:+$("qty").value,updatedAt:n})}else{x={id:uid(),name:$("name").value.trim(),code:$("code").value.trim(),unit:$("unit").value.trim()||"Nos",rate:+$("rate").value,qty:+$("qty").value,createdAt:n,updatedAt:n};db.items.push(x);if(x.qty)db.history.push({id:uid(),itemId:x.id,action:"Opening",qty:x.qty,oldQty:0,newQty:x.qty,at:n})}$("itemDlg").close();render();await save()}
function move(id,t){$("mid").value=id;$("mtype").value=t;$("moveTitle").textContent=t==="add"?"＋ Add Stock":"− Less Stock";$("mqty").value="";$("note").value="";$("moveDlg").showModal()}
async function moveSave(e){e.preventDefault();let x=db.items.find(a=>a.id===$("mid").value),n=+$("mqty").value,old=+x.qty,next=$("mtype").value==="add"?old+n:old-n;if(next<0){alert("Stock cannot go below zero.");return}x.qty=next;x.updatedAt=new Date().toISOString();db.history.push({id:uid(),itemId:x.id,action:$("mtype").value==="add"?"Added":"Less",qty:n,oldQty:old,newQty:next,note:$("note").value,at:x.updatedAt});$("moveDlg").close();render();await save()}
function history(id){let x=db.items.find(a=>a.id===id),h=db.history.filter(a=>a.itemId===id).sort((a,b)=>new Date(b.at)-new Date(a.at));$("hist").innerHTML=h.length?h.map(a=>`<div class=card><b>${a.action}</b> ${a.qty} ${esc(x.unit)}<br><span class=muted>${date(a.at)} • ${a.oldQty} → ${a.newQty}${a.note?" • "+esc(a.note):""}</span></div>`).join(""):"<p>No history.</p>";$("histDlg").showModal()}
async function del(id){let x=db.items.find(a=>a.id===id);if(confirm("Delete "+x.name+" and its history?")){db.items=db.items.filter(a=>a.id!==id);db.history=db.history.filter(a=>a.itemId!==id);render();await save()}}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="stock-backup-"+Date.now()+".json";a.click()}
function restoreFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let x=JSON.parse(r.result);if(!x.items||!x.history)throw 0;if(confirm("Replace current data with this backup?")){db=x;render();await save();alert("Restored.")}}catch{alert("Invalid backup.")}};r.readAsText(f);e.target.value=""}
render();setInterval(()=>{if(dir)save()},900000);
</script></body></html>
