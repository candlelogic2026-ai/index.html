<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accounts Dod • Stock Manager</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:system-ui;background:#f4f6fa;color:#182033}
header{background:#182033;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
main{max-width:1100px;margin:auto;padding:15px}
.card,.item{background:white;border:1px solid #e2e7ef;border-radius:14px;padding:14px;margin:10px 0}
button,input{font:inherit;padding:10px;border:1px solid #ddd;border-radius:9px;background:white}
button{font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:white}
.green{background:#e9f8f0}
.red{background:#fff0f0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat b{display:block;font-size:22px}
.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:220px}
.row{display:flex;justify-content:space-between;gap:10px}
.qty{font-size:22px;font-weight:800}
.muted{color:#687386;font-size:12px}
dialog{border:0;border-radius:15px;width:min(480px,92vw)}
dialog::backdrop{background:#0008}
.form{display:grid;gap:10px}
.form input{width:100%;box-sizing:border-box}

#loginScreen{
position:fixed;
inset:0;
background:#f4f6fa;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:9999
}

.loginbox{
background:white;
width:min(420px,100%);
padding:28px;
border-radius:18px;
box-shadow:0 10px 40px #0002
}

.loginbox input{
width:100%;
box-sizing:border-box;
margin:6px 0 12px
}

.loginbox button{
width:100%;
margin-top:6px
}

.error{
color:#c62828;
font-size:13px;
min-height:18px
}

#app{display:none}

@media(max-width:700px){
.stats{grid-template-columns:1fr 1fr}
header{align-items:flex-start}
}
</style>
</head>

<body>

<div id="loginScreen">
<div class="loginbox">

<h2>🔐 Accounts Dod</h2>
<p class="muted">Stock Manager Login</p>

<form id="loginForm">

<label>Email</label>

<input
id="loginEmail"
type="email"
value="ips16418@gmail.com"
autocomplete="username"
required>

<label>Password</label>

<input
id="loginPassword"
type="password"
autocomplete="current-password"
required>

<div id="loginError" class="error"></div>

<button class="primary" type="submit">
Login
</button>

<button type="button" onclick="forgotPassword()">
Forgot Password
</button>

</form>

</div>
</div>


<div id="app">

<header>

<div>
<b>📦 Accounts Dod • Stock Manager</b>

<div class="muted" style="color:#bdc6d5">
File-Sync Edition • Accounts Dod
</div>

</div>

<button onclick="logout()">🚪 Logout</button>

</header>


<main>

<div class="card">

<b>📁 Data Storage</b>

<p id="status">No folder selected</
